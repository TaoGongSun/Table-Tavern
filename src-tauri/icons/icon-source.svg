<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2e1e"/>
      <stop offset="1" stop-color="#2c1a10"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5b53f"/>
      <stop offset="1" stop-color="#d98b1f"/>
    </linearGradient>
  </defs>
  <clipPath id="squircle"><rect x="32" y="32" width="960" height="960" rx="224"/></clipPath>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <!-- 木桌面 -->
  <g clip-path="url(#squircle)">
    <rect x="32" y="704" width="960" height="288" fill="#6b4226"/>
    <rect x="32" y="704" width="960" height="28" fill="#8a5a33"/>
    <path d="M32 928 h960 v-40 H32 z" fill="#5a3620" opacity="0.6"/>
  </g>
  <!-- 啤酒杯 -->
  <g>
    <rect x="300" y="330" width="300" height="400" rx="36" fill="url(#beer)"/>
    <!-- 杯身直紋 -->
    <rect x="345" y="380" width="36" height="310" rx="18" fill="#ffffff" opacity="0.25"/>
    <rect x="432" y="380" width="36" height="310" rx="18" fill="#ffffff" opacity="0.18"/>
    <rect x="519" y="380" width="36" height="310" rx="18" fill="#ffffff" opacity="0.12"/>
    <!-- 把手 -->
    <path d="M600 400 h60 a90 90 0 0 1 90 90 v60 a90 90 0 0 1 -90 90 h-60 v-72 h52 a34 34 0 0 0 34 -34 v-28 a34 34 0 0 0 -34 -34 h-52 z" fill="#e8a52e"/>
    <!-- 泡沫 -->
    <g fill="#fdf6e3">
      <circle cx="330" cy="330" r="64"/>
      <circle cx="420" cy="300" r="80"/>
      <circle cx="520" cy="308" r="72"/>
      <circle cx="590" cy="340" r="56"/>
      <rect x="300" y="310" width="300" height="60" rx="30"/>
    </g>
  </g>
  <!-- 角色卡：斜靠在啤酒杯右側，底邊落在桌面 -->
  <g transform="rotate(18 745 610)">
    <rect x="620" y="390" width="250" height="360" rx="28" fill="#fdf6e3" stroke="#c9b896" stroke-width="10"/>
    <!-- 卡面：頭像框＋文字行 -->
    <circle cx="745" cy="490" r="58" fill="none" stroke="#b08b57" stroke-width="12"/>
    <circle cx="745" cy="475" r="22" fill="#b08b57"/>
    <path d="M705 522 a40 34 0 0 1 80 0" fill="#b08b57"/>
    <rect x="668" y="590" width="154" height="18" rx="9" fill="#b08b57"/>
    <rect x="668" y="632" width="154" height="18" rx="9" fill="#d4bb90"/>
    <rect x="668" y="674" width="104" height="18" rx="9" fill="#d4bb90"/>
  </g>
</svg>
