[package]
name = "table-tavern"
version = "0.5.0"
description = "A Tauri App"
authors = ["you"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "table_tavern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip", "preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["process", "io-util", "net", "rt", "macros", "time", "sync"] }
# 房間模式執行端連房間伺服器的 WebSocket（room/link.rs）；TLS 走樹內既有的 rustls＋webpki-roots。
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
ulid = "3"
regex = "1"
# 世界書正則鍵：JS 正則轉譯後需要前後看與反向參照（world_info/regex_key.rs）。
fancy-regex = "0.19.2"
tauri-plugin-updater = "~2.13"
minisign-verify = "0.2"
tar = "0.4"
flate2 = "1"
# VN 作品包 .ttvn（vn_work/）：只開 flate2 解壓，不帶 aes／bzip2／lzma／zstd；已是 updater 的傳遞依賴。
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
base64 = "0.22"
sha2 = "0.10"
semver = "1"
log = "0.4"
# 寫 grok-home 的 config.toml：只改 storage.cleanup_ttl_days、保留 grok 自己的段落（cli/home_cleanup）。
toml_edit = "0.25"
# 生圖輸出統一存 PNG：JPEG／WebP 解碼重編。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# 世界書機率與群組抽選的亂數（測試通道也用）。
getrandom = "0.3"
# 時間巨集的本地時區（st_macros/moment.rs）。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# zod 版 MVU 卡的變數 schema 與共用 MVU 引擎在隔離的 QuickJS 裡跑（mvu_engine/）；鎖版，升版要重跑上限測試。
rquickjs = { version = "=0.14.0", features = ["loader"] }
# GM 回覆端剝除判斷某行是否在程式碼區塊內，照 CommonMark 規則（transport/reply_cleanup.rs）；只用解析器。
pulldown-cmark = { version = "=0.13.4", default-features = false }
# VN 立繪去背（vn_sprites/matting.rs）：BiRefNet-lite。ONNX Runtime 由 build 時下載的預編靜態庫連進執行檔，不附動態庫；
# rc 版鎖版，升版要重跑去背實測。
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-17"] }

# CLI 更新：程序群組整組殺、在途 pid 存活檢查（cli/update）；已在依賴樹內
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Job Object（CLI 更新程序樹逾時整組殺）與在途 pid 存活檢查（cli/update）；房間模式防休眠（room/awake.rs，Win32_System_Power）
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"
# codex-home 硬連結的檔案身分（磁碟序號＋file index）；same-file 也是靠它，已在依賴樹內
winapi-util = "0.1.11"

[features]
# 只給主線自動化 GUI 實測的測試包用：`npm run harness:build`。正式包絕不開。
test-harness = ["dep:objc2", "dep:block2"]

# debug 產物曾膨脹到 146G：本 crate 只留行號（panic 回溯仍有檔名行號），相依套件不帶除錯資訊。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
minisign = "0.7"
# 更新外掛的時限測試要 mock app（updater/net_tests.rs）。
tauri = { version = "2", features = ["test"] }
# 回退點轉址降級測試的本機 https 假伺服器（updater/net_tests.rs）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
