[package]
name = "table-tavern"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "table_tavern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["process", "io-util", "net", "rt", "macros", "time", "sync"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
ulid = "3"
regex = "1"
# 世界書正則鍵：JS 正則轉譯後需要前後看與反向參照（world_info/regex_key.rs）。
fancy-regex = "0.19.2"
tauri-plugin-updater = "~2.13"
minisign-verify = "0.2"
tar = "0.4"
flate2 = "1"
base64 = "0.22"
sha2 = "0.10"
semver = "1"
log = "0.4"
# 生圖輸出統一存 PNG：JPEG／WebP 解碼重編。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# 世界書機率與群組抽選的亂數（測試通道也用）。
getrandom = "0.3"
# 時間巨集的本地時區（st_macros/moment.rs）。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"

[features]
# 只給主線自動化 GUI 實測的測試包用：`npm run harness:build`。正式包絕不開。
test-harness = ["dep:objc2", "dep:block2"]

[dev-dependencies]
minisign = "0.7"
