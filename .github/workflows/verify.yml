name: Verify

on:
  # 純文件改動不觸發；只要同一筆 commit 碰到任何程式檔就照跑。
  pull_request:
    paths-ignore:
      - ".ai/**"
      - "**.md"
  push:
    branches:
      - main
    paths-ignore:
      - ".ai/**"
      - "**.md"
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 與本地同一個入口：fmt／vitest／i18n／build／cargo check／cargo test
      # （順序相依寫在 scripts/verify.mjs，此處不另抄一份命令清單）
      - run: npm run verify
