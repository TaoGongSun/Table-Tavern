# 房間伺服器（Cloudflare Workers＋Durable Objects）。這份只供型別與本機 `npm run dev:server`（wrangler dev）；
# 不含任何帳號 id 或密鑰。部署時由部署者自己補 account_id（或用環境變數 CLOUDFLARE_ACCOUNT_ID），不進版控。
name = "table-tavern-party"
main = "index.ts"
compatibility_date = "2025-09-01"
# 正式網址＝自訂網域（桌面版預設連這裡）；workers.dev 關閉。
routes = [{ pattern = "tt-room.pirahus.com", custom_domain = true }]
workers_dev = false
# account_id = "<部署者自己的帳號 id，不進版控>"

# 手機客戶端（party/src；`npm run build` 產 party/dist）跟 Worker 一起部署（Workers Static Assets）。
# /r/<房間碼> 這類沒有對應檔案的路徑回 index.html（單頁應用）；/api/* 一律先交給 Worker（建房、WebSocket、匯出）。
[assets]
directory = "../../dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[vars]
# 閒置幾天整房刪除（1–365，協定 §2）
ROOM_IDLE_DAYS = "30"

# 建房限流（協定 §6.1：同 IP 每小時 10 次）。Rate Limiting binding 的 period 只能是 10 或 60 秒，
# 表達不了「每小時」；先用每分鐘 1 次（每小時最多 60 次）近似。namespace_id 是帳號內自訂的整數，佔位值。
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 1, period = 60 }
